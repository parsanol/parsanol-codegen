[package]
name = "parsanol-codegen-macros"
version = "0.1.0"
edition = "2021"
description = "The parg_parser! proc-macro: compile a PARG artifact into parser code at Rust compile time"
license = "MIT"
repository = "https://github.com/parsanol/parsanol-codegen"
publish = false

[lib]
proc-macro = true

[dependencies]
parsanol-codegen = { path = ".." }

[dev-dependencies]
regex = "1"
